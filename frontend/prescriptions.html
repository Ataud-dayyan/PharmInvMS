<!-- Doctors Console - Pharmacist Inventory Management System -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Portal - Prescription Management</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .nav {
            background: #512BD4;
            padding: 15px 25px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
        }

        .logout-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h3 {
            margin-top: 0;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #444;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .submit-btn {
            background: #512BD4;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        .item-row {
            display: grid;
            grid-template-columns: 2fr 1fr 2fr;
            gap: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="nav">
        <h2>📋 Doctor Prescription Console</h2>
        <div>
            <span id="welcomeText" style="margin-right: 15px; font-weight: 600;"></span>
            <button class="logout-btn" onclick="logoutUser()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h3>✍️ Issue New Medical Prescription</h3>
            <form id="prescriptionForm">
                <!-- Patient Search Dropdown -->
                <div class="form-group">
                    <label for="patientSearch">Patient</label>
                    <input type="text" id="patientSearch" list="patientOptions" required autocomplete="off"
                        placeholder="Type patient name or email to search..." />
                    <datalist id="patientOptions"></datalist>
                    <input type="hidden" id="patientId" />
                </div>

                <!-- Medication Item Matrix -->
                <div class="form-group">
                    <label>Medication Item Matrix</label>
                    <div id="medicationItemsContainer">
                        <div class="item-row">
                            <div>
                                <input type="text" class="item-drug-search" list="drugOptions" required
                                    autocomplete="off" placeholder="Type drug name to search..." />
                                <datalist id="drugOptions"></datalist>
                                <input type="hidden" class="item-drug-id" />
                            </div>
                            <div>
                                <input type="number" class="item-qty" required min="1" placeholder="Qty" value="1" />
                            </div>
                            <div>
                                <input type="text" class="item-instructions" required
                                    placeholder="Dosage e.g., 2x daily" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="prescriptionNotes">Clinical Notes & Directions</label>
                    <textarea id="prescriptionNotes" rows="3" placeholder="Additional clinical context..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Authorize & Transmit Order</button>
            </form>
        </div>

        <div class="card">
            <h3>🔍 Recent Issued Prescriptions Logs</h3>
            <div id="doctorLogContainer">
                <p style="color: #888; text-align: center; margin-top: 30px;">Loading diagnostic history logs...</p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/doctor.js"></script>
</body>

</html>
